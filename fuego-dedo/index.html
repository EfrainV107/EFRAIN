<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Fuego en tu dedo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
  #msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; background: rgba(0,0,0,.6); padding: 16px 24px; border-radius: 12px;
    font-size: 18px; text-align: center; z-index: 10;
  }
  #fps {
    position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 12px;
    background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px; z-index: 10;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="msg">Cargando cámara y detector de manos…<br>Levanta tu <b>dedo índice</b> 🫵</div>
<div id="fps"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const fpsEl = document.getElementById('fps');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---- Posición suavizada del dedo ----
let finger = { x: W / 2, y: H / 2, visible: false };
let target = { x: W / 2, y: H / 2, visible: false };

function onResults(results) {
  const tips = results.multiHandLandmarks || [];
  if (tips.length > 0) {
    // punta del índice = landmark 8
    const p = tips[0][8];
    target.x = p.x * W;
    target.y = p.y * H;
    target.visible = true;
  } else {
    target.visible = false;
  }
}

// ---- Partículas de fuego ----
const particles = [];
const MAX_PARTICLES = 220;

function spawnFire(x, y) {
  const n = 6;
  for (let i = 0; i < n; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    particles.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y + (Math.random() - 0.5) * 8,
      vx: (Math.random() - 0.5) * 0.8,
      vy: -(1.5 + Math.random() * 2.5),
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 10 + Math.random() * 24
    });
  }
}

function drawFire() {
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // brillo núcleo
  if (finger.visible) {
    const glow = ctx.createRadialGradient(finger.x, finger.y, 0, finger.x, finger.y, 60);
    glow.addColorStop(0, 'rgba(120,255,160,0.55)');
    glow.addColorStop(1, 'rgba(0,180,80,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(finger.x, finger.y, 110, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy -= 0.03;           // las llamas aceleran hacia arriba
    p.vx += (Math.random() - 0.5) * 0.15;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    const t = 1 - p.life;
    let r, g, b;
    if (t < 0.25)      { r = 180; g = 255; b = 200; }  // blanco-verde fosforescente
    else if (t < 0.5)  { r = 60;  g = 255; b = 140; }  // verde brillante
    else if (t < 0.75) { r = 10;  g = 220; b = 80;  }  // verde fosforescente
    else               { r = 0;   g = 130; b = 50;  }  // verde oscuro

    const size = p.size * p.life;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);
    grad.addColorStop(0, `rgba(${r},${g},${b},${p.life})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
}

// ---- Bucle principal ----
let last = performance.now(), frames = 0, fpsTime = 0;

function loop(now) {
  const dt = Math.min((now - last) / 16.67, 3);
  last = now;

  // suavizado (lerp)
  const k = 1 - Math.pow(0.75, dt);
  finger.x += (target.x - finger.x) * k;
  finger.y += (target.y - finger.y) * k;
  finger.visible = target.visible;

  if (finger.visible) spawnFire(finger.x, finger.y);
  if (finger.visible && particles.length < MAX_PARTICLES) spawnFire(finger.x, finger.y);

  // partículas se apagan si la mano desaparece
  drawFire();

  frames++;
  fpsTime += now - last;
  if (fpsTime > 500) {
    fpsEl.textContent = Math.round(frames * 1000 / fpsTime) + ' FPS · partículas: ' + particles.length;
    frames = 0; fpsTime = 0;
    last = now;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- MediaPipe ----
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,          // modelo ligero = más FPS
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
hands.onResults((r) => {
  onResults(r);
  if (!msg.hidden) {
    msg.hidden = true;
  }
});

const camera = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 640,
  height: 480
});
camera.start();
</script>
</body>
</html>
